replicaCount: 2

image:
  repository: hub-registry.mfu.ac.th/longevity/web
  tag: production-latest
  pullPolicy: IfNotPresent

imagePullSecret: harbor-registry

service:
  port: 80

ingress:
  className: nginx
  host: longevity.mfu.ac.th
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1


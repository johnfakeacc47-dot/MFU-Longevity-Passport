server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Security headers — the same set vercel.json sends for the Vercel
    # deployment, so the Docker image is not the weaker of the two.
    #
    # They are repeated inside EVERY location block below, not set once at
    # server level. That is not sloppiness: nginx's add_header is inherited
    # from the enclosing level only if the location has NO add_header of its
    # own, and every location here sets Cache-Control. With the headers only
    # at server level (as before) they were silently dropped from every
    # response. Keep the four blocks identical when editing.
    #
    # CSP differences from vercel.json, both deliberate:
    #  - no `upgrade-insecure-requests`: this container listens on plain
    #    :80. Behind a TLS-terminating proxy it would be harmless, but on a
    #    bare `docker run -p 8080:80` reached via a LAN IP (not localhost)
    #    it would rewrite every same-origin asset URL to https:// and blank
    #    the page. Terminate TLS in front and the page is secure anyway.
    #  - HSTS is included as asked; browsers only honour it over HTTPS, so
    #    it is inert until a TLS proxy forwards it, and harmless before.
    # ------------------------------------------------------------------

    # Hashed build assets (filename includes a content hash, e.g.
    # index-B_kP-fCa.css) — safe to cache forever, since a new deploy ships
    # under a new filename rather than overwriting this one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://va.vercel-scripts.com https://vitals.vercel-insights.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), browsing-topics=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # The service worker and manifest must always be revalidated. This is
    # not optional — src/main.tsx's periodic update check (added because an
    # already-installed iPhone PWA could get permanently stuck on an old
    # version otherwise) depends on being able to fetch a fresh copy of
    # sw.js on every check; caching it here would silently reintroduce that
    # exact bug at the infrastructure layer instead of the app layer.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://va.vercel-scripts.com https://vitals.vercel-insights.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), browsing-topics=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://va.vercel-scripts.com https://vitals.vercel-insights.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), browsing-topics=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Everything else — the SPA shell (index.html) and any route the app
    # handles client-side (e.g. deep links like /?add=<handle>) — also
    # always revalidate, and fall back to index.html for client-side routes.
    location / {
        add_header Cache-Control "no-cache" always;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://va.vercel-scripts.com https://vitals.vercel-insights.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), browsing-topics=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}

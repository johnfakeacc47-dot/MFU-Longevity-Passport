server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (filename includes a content hash, e.g.
    # index-B_kP-fCa.css) — safe to cache forever, since a new deploy ships
    # under a new filename rather than overwriting this one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker and manifest must always be revalidated. This is
    # not optional — src/main.tsx's periodic update check (added because an
    # already-installed iPhone PWA could get permanently stuck on an old
    # version otherwise) depends on being able to fetch a fresh copy of
    # sw.js on every check; caching it here would silently reintroduce that
    # exact bug at the infrastructure layer instead of the app layer.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else — the SPA shell (index.html) and any route the app
    # handles client-side (e.g. deep links like /?add=<handle>) — also
    # always revalidate, and fall back to index.html for client-side routes.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
